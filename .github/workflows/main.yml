name: CI

on:
    push:
        branches: ["develop"]
    workflow_dispatch:

jobs:
    CI:
        runs-on: ubuntu-latest
        steps:
            - name: Obtendo o código
              uses: actions/checkout@v4.2.2           
            
            - name: Debug Secrets
              run: |                
                echo "DOCKERHUB_USERNAME ${{ vars.DOCKERHUB_USERNAME}}"                                   
                echo "DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}"

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Construção e Envio da Imagem Docker
              uses: docker/build-push-action@v6
              with:
                context: ./src
                push: true
                file: ./src/Dockerfile
                tags: ${{ vars.DOCKERHUB_USERNAME }}/fake-shop-desafio:v${{ github.run_number }}

    CD:
      runs-on: ubuntu-latest
      steps:
        - name: Credencias do Kubernet
          uses: azure/k8s-set-context@v4
          with:
            method: kubeconfig
            kubeconfig: ${{ secrets.K8S_KUBECONFIG }}
      
        - name: Deployment
          uses: Azure/k8s-deploy@v5
          with:
            manifests: |
              k8s/deployment.yaml
            images: |  
              ${{ vars.DOCKERHUB_USERNAME }}/fake-shop-desafio:v${{ github.run_number }}