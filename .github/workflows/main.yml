name: CI-CD

on:
    push:
        branches: ["develop"]
    workflow_dispatch:

jobs:
    CI:
        runs-on: ubuntu-latest
        steps:
            - name: Obtendo o código
              uses: actions/checkout@v4.2.2           
            
            - name: Debug Secrets
              run: |                
                echo "DOCKERHUB_USERNAME ${{ vars.DOCKERHUB_USERNAME}}"                                   
                echo "DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}"

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Construção e Envio da Imagem Docker
              uses: docker/build-push-action@v6
              with:
                context: ./src
                push: true
                file: ./src/Dockerfile
                tags: ${{ vars.DOCKERHUB_USERNAME }}/fake-shop-desafio:v${{ github.run_number }}
    CD:
        needs: [CI]
        runs-on: ubuntu-latest
        steps:
            - name: Obtendo o código
              uses: actions/checkout@v4.2.2  
            
            - name: Debug Secrets
              run: |                
                echo "DOCKERHUB_USERNAME: ${{ secrets.K8S_KUBECONFIG }}"                                   
                echo "WORKSPACE: ${{ github.workspace }}"
              
            - name: Load image into K3D cluster
              run: k3d image import ${{ vars.DOCKERHUB_USERNAME }}/fake-shop-desafio:v${{ github.run_number }} -c k3d-k3s-default

            - name: Deploy to K3D
              run: |
                  kubectl apply -f kubernetes/deployment.yaml
                  kubectl apply -f kubernetes/service.yaml
              env:
                KUBECONFIG: ${{ github.workspace }}/${{ secrets.K8S_KUBECONFIG }}
                
